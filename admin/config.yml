backend:
  name: git-gateway
  branch: main # Change this to master if your default branch is called master

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Διαχείριση"
    delete: false
    editor:
      preview: false
    files:
      - name: "reviews"
        label: "Κριτικές Ασθενών"
        file: "reviews.json"
        fields:
          - label: "Λίστα Ενεργών Κριτικών"
            name: "reviews"
            widget: "list"
            allow_add: true
            fields:
              - { label: "Όνομα", name: "name", widget: "string" }
              - { label: "Βαθμολογία (π.χ. 10.0)", name: "score", widget: "string" }
              - { label: "Κείμενο Κριτικής", name: "text", widget: "text" }
